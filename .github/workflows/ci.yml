name: CI

# Прогон на каждый push и на каждый pull request: сборка пакета публичная,
# поэтому проверка не ждёт merge, а закрывает ветку до него.
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # npm ci, а не npm install: lock-файл источник истины, состав зависимостей
      # в CI обязан совпадать с локальным до патч-версии.
      - run: npm ci
      - run: npm run typecheck
      # Живые прогоны против настоящего сервера мессенджера в CI не запускаются:
      # переменная CLOUDS_MESSENGER_MCP_E2E не выставлена, поэтому набор ограничен
      # unit и integration тестами на моках. Браузер Playwright тоже не ставится:
      # авторизация поднимается лениво и в тестах не участвует.
      - run: npm test
      # Сборка последним шагом: она проверяет, что публикуемый dist собирается
      # тем же tsconfig, которым пользуется релизный workflow.
      - run: npm run build
      # Проверка поставки: настоящий тарбол, чистая установка, tools/list по stdio.
      # Только она ловит потерянный shebang, забытый файл в files и
      # незарегистрированный инструмент, поэтому идёт в CI, а не остаётся ручным шагом.
      - run: npm run verify:package
